name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linie-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd
    with:
      package-manager: npm
      runtime-version: "11.20.0"
      node-version: "26.13.0"
      install-policy: blocked
      coverage-path: coverage
      lockfiles: package-lock.json
      build: true
      build-command: npm run deploy:dry-run

  browser:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd
    with:
      runtime: npm
      runtime-version: "11.20.0"
      node-version: "26.13.0"
      install-policy: blocked
      browser: chromium
      command: npm run test:e2e
      artifact-name: browser-report
      artifact-path: playwright-report
      artifact-retention-days: 7

  workflow-lint:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
